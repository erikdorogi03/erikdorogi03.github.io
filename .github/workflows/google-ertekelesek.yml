name: Google értékelések frissítése

on:
  schedule:
    - cron: '17 4 * * *'   # minden nap 04:17 UTC
  workflow_dispatch:         # kézzel is indítható az Actions fülön

permissions:
  contents: write

concurrency:
  group: google-ertekelesek
  cancel-in-progress: false

jobs:
  frissites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Értékelések letöltése
        run: node scripts/fetch-reviews.mjs
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      - name: Mentés, ha változott
        run: |
          if [ -n "$(git status --porcelain reviews.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add reviews.json
            git commit -m "Google értékelések frissítése"
            git push
          else
            echo "Nincs új értékelés."
          fi
